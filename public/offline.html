<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1210" />
    <title>Sem conexão | Minhas Finanças</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b1210;
        color: #ecf3f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px;
        border-radius: 16px;
        background: #141f1c;
        border: 1px solid #243530;
        text-align: center;
      }
      .badge {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: rgba(52, 211, 153, 0.14);
        color: #34d399;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        font-size: 0.92rem;
        line-height: 1.5;
        color: #9cb0a8;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: #34d399;
        color: #091d16;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">R$</div>
      <h1>Você está offline</h1>
      <p>
        Não foi possível conectar ao Minhas Finanças agora. Verifique sua internet e tente
        novamente.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
